    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        montserrat: ['"Montserrat"', 'sans-serif'],
                        script: ['"Dancing Script"', 'cursive']
                    },
                    colors: {
                        brand: {
                            pink: '#ec4899',
                            rose: '#f472b6',
                            dark: '#be185d',
                            cream: '#fce7f3'
                        }
                    },

                        'float': 'float 6s ease-in-out infinite',
                        'heartbeat': 'heartbeat 1.5s ease-in-out infinite',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '25%': { transform: 'scale(1.1)' },
                            '50%': { transform: 'scale(1)' },
                            '75%': { transform: 'scale(1.1)' },
                        },
                        fadeIn: {

    <script>
        const container = document.getElementById('hearts-container');
        const heartSymbols = ['💖', '💕', '💗', '💓', '🌸', '✨'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 6 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 12000); 
        }

        setInterval(createHeart, 600);
        for(let i = 0; i < 8; i++) {
            setTimeout(createHeart, i * 150);
        }

        // --- Efecto Flip 3D Romántico para Fotos ---
        const photos = document.querySelectorAll('.break-inside-avoid');
        const romanticPhrases = [
            "Eres bella", 
            "Eres Hermosa", 
            "Me gustas", 
            "Me encantas", 
            "Eres el amor de mi vida", 
            "Te amo Mucho", 
            "I Love You",
            "Mi niña hermosa",
            "Preciosa mi amor",
            "Mi vida entera",
            "Contigo todo es mejor",

            
        ];

        photos.forEach(photoEl => {
            // Guardar el contenido original de la imagen
            const imgHTML = photoEl.innerHTML;
            photoEl.innerHTML = ''; 
            
            // Ajustar el contenedor padre para el 3D
            photoEl.className = 'break-inside-avoid mb-6 w-full cursor-pointer hover:scale-[1.02] transition-transform duration-300';
            photoEl.style.perspective = '1500px'; // Da el efecto de profundidad

            // Contenedor que rota
            const flipInner = document.createElement('div');
            flipInner.className = 'relative w-full h-full transition-transform duration-[800ms] rounded-2xl';
            flipInner.style.transformStyle = 'preserve-3d';
            
            // Cara Frontal (La foto actual)
            const front = document.createElement('div');
            front.className = 'w-full h-full rounded-2xl relative shadow-lg shadow-brand-pink/10 border border-brand-pink/20 overflow-hidden group bg-gray-800';
            front.style.backfaceVisibility = 'hidden';
            front.style.webkitBackfaceVisibility = 'hidden';
            front.innerHTML = imgHTML;

            // Cara Trasera (El mensaje)
            const back = document.createElement('div');
            back.className = 'absolute inset-0 w-full h-full rounded-2xl flex items-center justify-center p-6 text-center shadow-[0_0_30px_rgba(236,72,153,0.5)] bg-gradient-to-br from-gray-900 via-gray-800 to-black border-2 border-brand-pink/80 overflow-hidden';
            back.style.transform = 'rotateY(180deg)';
            back.style.backfaceVisibility = 'hidden';
            back.style.webkitBackfaceVisibility = 'hidden';
            
            // Contenido trasero
            const frase = romanticPhrases[Math.floor(Math.random() * romanticPhrases.length)];
            back.innerHTML = `
                <div class="absolute inset-0 bg-brand-pink/10 backdrop-blur-sm"></div>
                <h3 class="font-script text-3xl md:text-5xl text-brand-rose leading-tight drop-shadow-[0_2px_15px_rgba(236,72,153,0.8)] z-10 select-none">
                    ${frase}
                </h3>
                <span class="absolute bottom-4 right-4 text-2xl animate-heartbeat z-10 select-none">💕</span>
            `;

            flipInner.appendChild(front);
            flipInner.appendChild(back);
            photoEl.appendChild(flipInner);

            // Al hacer click, voltear la carta
            photoEl.addEventListener('click', () => {
                const isFlipped = flipInner.style.transform === 'rotateY(180deg)';
                flipInner.style.transform = isFlipped ? 'rotateY(0deg)' : 'rotateY(180deg)';
            });
        });
    </script>
